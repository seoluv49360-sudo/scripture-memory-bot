# 이 PC/서버에 80/443을 쓰는 다른 Caddy가 없을 때만 쓰는 오버레이.
# 사용법: docker compose -f docker-compose.yml -f docker-compose.demo.yml -f docker-compose.standalone-caddy.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - demo-api

volumes:
  caddy_data:
  caddy_config:
